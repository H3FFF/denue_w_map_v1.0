<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Delivery MX - Mapa Interactivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        .filter-panel {
            position: absolute; bottom: 30px; left: 30px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 280px; border: 3px solid #1a5276;
        }
        .filter-panel h3 { margin: 0 0 15px 0; color: #1a5276; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .filter-group { margin-bottom: 12px; }
        .filter-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; color: #555; }
        .filter-group select { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; }
        
        .btn-apply { width: 100%; padding: 10px; background: #1a5276; color: white; border: 2px solid #0d2a40; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-apply:hover { background: #2c3e50; }

        /* Estilos para marcadores de color */
        .custom-marker {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: white; font-weight: bold;
        }

        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 4px solid #1a5276;
        }
        .spinner {
            border: 5px solid #f3f3f3; border-top: 5px solid #1a5276; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="font-weight:bold; color:#1a5276;">Cargando Base de Datos...</p>
    </div>
    
    <div id="map"></div>
    
    <div class="filter-panel">
        <h3><i class="fas fa-filter"></i> Filtros y Colores</h3>
        
        <div class="filter-group">
            <label>Modo de Color:</label>
            <select id="modo-color" onchange="aplicarFiltros()">
                <option value="status">Por Status (Animados)</option>
                <option value="municipio">Por Municipio (Colores)</option>
                <option value="cp">Por Código Postal (Colores)</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Municipio:</label>
            <select id="filtro-municipio"><option value="">Todos los municipios</option></select>
        </div>
        
        <div class="filter-group">
            <label>Código Postal:</label>
            <select id="filtro-cp"><option value="">Todos los CP</option></select>
        </div>
        
        <button onclick="aplicarFiltros()" class="btn-apply">Aplicar Filtros</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let map, markers = [], allData = [], cambiosStatus = {};
        
        // Configuración de status para modo animado
        const STATUS_CONFIG = {
            "INTERESADO": { emoji: "📡", color: "#FF007F", tipo: "radar" },
            "PICK UP": { emoji: "🚀", color: "#00C853", tipo: "bounce" },
            "NO INTERESADO": { emoji: "⛔", color: "#9E9E9E", tipo: "opaco" },
            "CONTACTADO": { emoji: "📞", color: "#3498db", tipo: "normal" },
            "SIN RESPUESTA": { emoji: "💤", color: "#f39c12", tipo: "normal" }
        };
        
        function initMap() {
            map = L.map('map').setView([19.4326, -99.1332], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CARTO', maxZoom: 19
            }).addTo(map);
        }
        
        async function cargarDatos() {
            try {
                const response = await fetch('datos.json');
                if (!response.ok) throw new Error("No se pudo cargar datos.json");
                const data = await response.json();
                allData = data.datos;
                poblarFiltros();
                aplicarFiltros(); // Carga inicial con modo por defecto
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar datos.json.');
            }
        }
        
        function poblarFiltros() {
            const municipios = [...new Set(allData.map(d => d.municipio))].sort();
            const codigosPostales = [...new Set(allData.map(d => d.cod_postal))].sort();
            
            const selectMun = document.getElementById('filtro-municipio');
            const selectCP = document.getElementById('filtro-cp');
            
            municipios.forEach(mun => {
                if (mun && mun !== 'No disponible') {
                    const opt = document.createElement('option');
                    opt.value = mun; opt.textContent = mun;
                    selectMun.appendChild(opt);
                }
            });
            
            codigosPostales.forEach(cp => {
                if (cp && cp !== 'No disponible') {
                    const opt = document.createElement('option');
                    opt.value = cp; opt.textContent = cp;
                    selectCP.appendChild(opt);
                }
            });
        }

        // Función para crear iconos de color sólido (para Municipio/CP)
        function crearIconoColor(colorHex) {
            return L.divIcon({
                className: '',
                html: `<div class="custom-marker" style="background-color: ${colorHex};"></div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        // Función para crear iconos animados (para Status)
        function crearIconoStatus(status) {
            const config = STATUS_CONFIG[status];
            if (!config) return L.icon({ iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png' });
            
            let html = '';
            if (config.tipo === 'radar') {
                html = `<div class="marker-radar-wrapper"><div class="marker-radar-ring"></div><div class="marker-radar-ring"></div><div class="marker-radar-ring"></div><div class="marker-radar-core">!</div></div>`;
                return L.divIcon({ className: '', html: html, iconSize: [44, 44], iconAnchor: [22, 22] });
            } else if (config.tipo === 'bounce') {
                html = `<div class="marker-bounce-wrapper"><div class="marker-bounce-core">🚀</div></div>`;
                return L.divIcon({ className: '', html: html, iconSize: [34, 34], iconAnchor: [17, 17] });
            } else {
                return L.divIcon({
                    className: '',
                    html: `<div style="background:${config.color}; width:30px; height:30px; border-radius:50%; border:3px solid white; box-shadow:0 0 8px ${config.color}; display:flex; align-items:center; justify-content:center; font-size:14px;">${config.emoji}</div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15]
                });
            }
        }
        
        function generarPopup(row) {
            // Popup simplificado para este ejemplo
            return `
                <div style="font-family:Arial,sans-serif; min-width:240px; font-size:13px; border-left:5px solid ${row.color_municipio}; padding-left:10px;">
                    <b style="font-size:15px; color:#1a5276;">${row.nom_estab}</b><br>
                    <b>Status:</b> ${row.status}<br>
                    <b>Municipio:</b> ${row.municipio}<br>
                    <b>CP:</b> ${row.cod_postal}<br>
                    <b>Teléfono:</b> ${row.telefono}
                </div>`;
        }
        
        function aplicarFiltros() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            const municipio = document.getElementById('filtro-municipio').value;
            const cp = document.getElementById('filtro-cp').value;
            const modoColor = document.getElementById('modo-color').value;
            
            let filtered = allData;
            if (municipio) filtered = filtered.filter(d => d.municipio === municipio);
            if (cp) filtered = filtered.filter(d => d.cod_postal === cp);
            
            filtered.forEach(row => {
                if (!row.latitud || !row.longitud) return;
                
                let icon;
                if (modoColor === 'municipio') {
                    icon = crearIconoColor(row.color_municipio);
                } else if (modoColor === 'cp') {
                    icon = crearIconoColor(row.color_cp);
                } else {
                    icon = crearIconoStatus(row.status);
                }

                const marker = L.marker([row.latitud, row.longitud], { icon: icon });
                marker.bindPopup(generarPopup(row));
                marker.addTo(map);
                markers.push(marker);
            });
        }
        
        window.addEventListener('load', function() {
            initMap();
            cargarDatos();
        });
    </script>
</body>
</html>
