name: Actualizar Datos del Mapa

on:
  push:
    paths:
      - 'DENUE 2026.xlsx' # Se activa cuando subes el Excel
  workflow_dispatch:      # Permite ejecutarlo manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Instalar dependencias
      run: |
        pip install pandas openpyxl
    
    - name: Generar JSON desde Excel
      run: python generar_json.py
    
    - name: Commit y Push si hay cambios
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add datos.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de datos del mapa" && git push)
